<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5折特價雷達</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f6f6f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      color: #222;
    }

    header {
      background: white;
      padding: 22px 18px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #eee;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 14px;
    }

    .section-title {
      font-size: 13px;
      color: #777;
      margin: 8px 2px 7px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    button {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 14px;
    }

    button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .summary {
      margin: 18px 2px 10px;
      font-size: 14px;
      color: #666;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .store {
      font-size: 13px;
      font-weight: 600;
      color: #666;
    }

    .discount {
      background: #ffedf1;
      color: #e83762;
      font-size: 16px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 9px;
    }

    .name {
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .prices {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .original {
      color: #999;
      text-decoration: line-through;
      font-size: 14px;
    }

    .sale {
      font-size: 25px;
      font-weight: 750;
      color: #e83762;
    }

    .save {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .link {
      display: block;
      margin-top: 14px;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      background: #f3f3f3;
      color: #222;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #999;
    }
  </style>
</head>

<body>

<header>
  <h1>5折特價雷達</h1>
  <div class="subtitle">
    寶雅・屈臣氏・康是美｜只顯示5折以下商品
  </div>
</header>

<div class="container">

  <div class="section-title">商店</div>

  <div class="filters" id="storeFilters">
    <button class="active" data-store="all">全部</button>
    <button data-store="寶雅">寶雅</button>
    <button data-store="屈臣氏">屈臣氏</button>
    <button data-store="康是美">康是美</button>
  </div>

  <div class="summary" id="summary"></div>

  <div id="products"></div>

</div>

<script>

const products = [
  {
    store: "寶雅",
    name: "LUX療癒精油香氛洗髮精280ml 舒心雪松",
    original: 209,
    sale: 99,
    url: "#"
  },

  {
    store: "屈臣氏",
    name: "測試商品",
    original: 399,
    sale: 199,
    url: "#"
  },

  {
    store: "康是美",
    name: "這個商品超過5折，所以不會顯示",
    original: 599,
    sale: 349,
    url: "#"
  }
];

let selectedStore = "all";

function render() {

  const container = document.getElementById("products");

  const filtered = products
    .map(p => ({
      ...p,
      rate: p.sale / p.original
    }))

    // 固定只顯示5折以下
    .filter(p => {
      const storeOK =
        selectedStore === "all" ||
        p.store === selectedStore;

      const discountOK = p.rate <= 0.5;

      return storeOK && discountOK;
    })

    // 折扣最低的排最前面
    .sort((a, b) => a.rate - b.rate);

  document.getElementById("summary").textContent =
    `找到 ${filtered.length} 個5折以下商品`;

  if (filtered.length === 0) {
    container.innerHTML =
      `<div class="empty">目前沒有5折以下商品</div>`;
    return;
  }

  container.innerHTML = filtered.map(p => {

    const discount = (p.rate * 10).toFixed(1);
    const saved = p.original - p.sale;

    return `
      <div class="product">

        <div class="top">
          <div class="store">${p.store}</div>
          <div class="discount">${discount}折</div>
        </div>

        <div class="name">${p.name}</div>

        <div class="prices">
          <div class="original">NT$${p.original}</div>
          <div class="sale">NT$${p.sale}</div>
        </div>

        <div class="save">
          現省 NT$${saved}
        </div>

        <a
          class="link"
          href="${p.url}"
          target="_blank"
        >
          查看商品
        </a>

      </div>
    `;
  }).join("");
}

document
  .querySelectorAll("#storeFilters button")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll("#storeFilters button")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
      selectedStore = button.dataset.store;

      render();
    });
  });

render();

</script>

</body>
</html>
