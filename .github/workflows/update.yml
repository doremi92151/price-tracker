name: Update Price Tracker

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每天 06:00、12:00、18:00
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Save results
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push
